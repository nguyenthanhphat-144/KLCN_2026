{% extends "base.html" %}
{% block title %}Đăng nhập - Hệ thống Quản lý Hồ sơ KH&CN{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 78vh;">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card card-academic">
            <div class="card-body p-4">
                <div class="text-center mb-4 pb-2 border-bottom">
                    <div class="fw-bold text-uppercase" style="color: var(--primary-navy); font-size: 1rem;">
                        Hệ thống Quản lý Hồ sơ KH&CN
                    </div>
                    <div class="text-muted small mt-1">
                        Cổng thông tin kê khai và thẩm định công trình nghiên cứu
                    </div>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold mb-1">Email đăng nhập</label>
                        <input type="email" name="email" id="loginEmail" class="form-control"
                               placeholder="ten_tai_khoan@uni.edu.vn" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold mb-1">Mật khẩu</label>
                        <input type="password" name="matKhau" id="loginPassword" class="form-control"
                               placeholder="Nhập mật khẩu" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background-color: var(--primary-navy); border-color: var(--primary-navy);">
                        Đăng nhập
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top">
                    <div class="small text-muted mb-2">Chọn nhanh tài khoản thử nghiệm:</div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center"
                                onclick="fillLogin('admin@uni.edu.vn', 'Admin@123')">
                            <span><strong>Quản trị viên:</strong> Nguyễn Thành Phát</span>
                            <code class="small">admin@uni.edu.vn</code>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center"
                                onclick="fillLogin('canbo@uni.edu.vn', 'CanBo@123')">
                            <span><strong>Cán bộ duyệt:</strong> Lê Thanh Phong</span>
                            <code class="small">canbo@uni.edu.vn</code>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center"
                                onclick="fillLogin('tacgia@uni.edu.vn', 'TacGia@123')">
                            <span><strong>Tác giả / GV:</strong> Nguyễn Thành Tài</span>
                            <code class="small">tacgia@uni.edu.vn</code>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(email, pwd) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pwd;
}
</script>
{% endblock %}
