{% extends "base.html" %}
{% block title %}Đổi mật khẩu an toàn - Quản lý Hồ sơ KH&CN{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-academic">
            <div class="card-header card-header-academic">
                <i class="bi bi-shield-lock-fill me-2"></i>Đổi Mật Khẩu Tài Khoản
            </div>
            <div class="card-body p-4">
                <p class="text-muted small mb-4">
                    Vui lòng nhập mật khẩu hiện tại để xác thực trước khi thiết lập mật khẩu mới.
                </p>
                <form method="POST" action="{{ url_for('change_password') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu hiện tại (*)</label>
                        <input type="password" name="matKhauHienTai" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu mới (tối thiểu 6 ký tự) (*)</label>
                        <input type="password" name="matKhauMoi" class="form-control" minlength="6" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Xác nhận mật khẩu mới (*)</label>
                        <input type="password" name="xacNhanMatKhauMoi" class="form-control" minlength="6" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Quay lại</a>
                        <button type="submit" class="btn btn-primary fw-bold">
                            <i class="bi bi-check2-circle me-1"></i>Cập nhật mật khẩu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
